          if (t.preset && ['system','light','blue-dark'].indexOf(t.preset) === -1)

          if (t.accentColor) {
            root.style.setProperty('--primary', t.accentColor);
            root.style.setProperty('--ring', t.accentColor);
            root.style.setProperty('--sidebar-primary', t.accentColor);
